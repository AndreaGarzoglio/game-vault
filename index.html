<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Vault</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
    <script src="data/template-vault.js" defer></script>
    <script src="js/script-ui.js" defer></script>
    <script src="js/script-store.js" defer></script>
    <script src="js/script-export.js" defer></script>
    <script src="js/script-collections.js" defer></script>
    <script src="js/script-fx.js" defer></script>
    <script src="js/script-background.js" defer></script>
    <script src="js/script-picker.js" defer></script>
    <script src="js/script-wiki.js" defer></script>
    <script src="js/script-ratings.js" defer></script>
    <script src="js/script-ranking.js" defer></script>
    <script src="js/script-enhancements.js" defer></script>
    <script src="js/script-filter.js" defer></script>
    <script src="js/script-detail.js" defer></script>
    <script src="js/script.js" defer></script>
    <script src="js/script-tiers.js" defer></script>
    <script src="js/script-about.js" defer></script>
    <script src="js/script-tops.js" defer></script>
</head>

<body>
    <canvas id="pixelBg"></canvas>

    <!-- Icon sprite: defined once, referenced with <use> everywhere else. -->
    <svg class="icon-sprite" aria-hidden="true">
        <symbol id="i-search" viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2" />
            <path d="M16.5 16.5L21 21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        </symbol>
        <symbol id="i-plus" viewBox="0 0 24 24">
            <path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" />
        </symbol>
        <symbol id="i-pencil" viewBox="0 0 24 24">
            <path fill="currentColor"
                d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z" />
        </symbol>
        <symbol id="i-trash" viewBox="0 0 24 24">
            <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3" />
        </symbol>
        <symbol id="i-chevron-down" viewBox="0 0 24 24">
            <path d="M5 8l7 7 7-7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"
                stroke-linejoin="round" />
        </symbol>
        <symbol id="i-refresh" viewBox="0 0 24 24">
            <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                d="M20 11a8 8 0 1 0-.6 4M20 4v6h-6" />
        </symbol>
        <symbol id="i-close" viewBox="0 0 24 24">
            <path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" />
        </symbol>
        <symbol id="i-folder" viewBox="0 0 24 24">
            <path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"
                d="M3 6h6l2 2.5h10V19H3z" />
        </symbol>
        <symbol id="i-grid" viewBox="0 0 24 24">
            <path fill="currentColor" d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z" />
        </symbol>
        <symbol id="i-layers" viewBox="0 0 24 24">
            <path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M12 3l9 5-9 5-9-5z" />
            <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                d="M3 13l9 5 9-5" />
        </symbol>
        <symbol id="i-user" viewBox="0 0 24 24">
            <circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="2" />
            <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                d="M4 20c1.5-4.5 5-6 8-6s6.5 1.5 8 6" />
        </symbol>
        <symbol id="i-list" viewBox="0 0 24 24">
            <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01" />
        </symbol>
        <symbol id="i-download" viewBox="0 0 24 24">
            <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                d="M12 3v12m0 0l-4-4m4 4l4-4M4 21h16" />
        </symbol>
        <symbol id="i-upload" viewBox="0 0 24 24">
            <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                d="M12 15V3m0 0l-4 4m4-4l4 4M4 21h16" />
        </symbol>
        <symbol id="i-arrow-right" viewBox="0 0 24 24">
            <path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.4"
                stroke-linecap="round" stroke-linejoin="round" />
        </symbol>
        <symbol id="i-award" viewBox="0 0 24 24">
            <circle cx="12" cy="9" r="6" fill="none" stroke="currentColor" stroke-width="2" />
            <path d="M8.5 14.5L7 21l5-2.5 5 2.5-1.5-6.5" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round" />
        </symbol>
        <symbol id="i-menu" viewBox="0 0 24 24">
            <path d="M4 6h16M4 12h16M4 18h16" fill="none" stroke="currentColor" stroke-width="2.2"
                stroke-linecap="round" />
        </symbol>
    </svg>

    <div class="app">
        <header class="mobile-topbar">
            <button class="mobile-topbar__menu icon-btn" type="button" id="sidebarToggle" aria-label="Open menu"
                aria-expanded="false" aria-controls="sidebar">
                <svg class="icon" aria-hidden="true"><use href="#i-menu" /></svg>
            </button>
            <img class="mobile-topbar__logo" src="favicon.svg" alt="">
            <span class="mobile-topbar__name">Game Vault</span>
        </header>
        <div class="sidebar__backdrop" id="sidebarBackdrop" hidden></div>

        <aside class="sidebar" id="sidebar">
            <div class="brand">
                <img class="brand__logo" src="favicon.svg" alt="">
                <div class="brand__text">
                    <h1 class="brand__name">Game Vault</h1>
                    <p class="brand__tagline">Rated your way</p>
                </div>
                <button class="sidebar__close icon-btn" type="button" id="sidebarClose" aria-label="Close menu">
                    <svg class="icon" aria-hidden="true"><use href="#i-close" /></svg>
                </button>
            </div>

            <button class="addBtn btn-notch" type="button">
                <span class="btn-notch__inner">
                    <svg class="icon" aria-hidden="true">
                        <use href="#i-plus" />
                    </svg>
                    Add game
                </span>
            </button>
            <button class="btn-notch cancelBtn sidebar__bulk-add" type="button" id="bulkAddBtn">
                <span class="btn-notch__inner">Add multiple</span>
            </button>

            <div class="sidebar__scroll">
                <nav class="nav">
                    <p class="nav__title">Views</p>
                    <button class="nav__item is-active" type="button" data-app-view="library">
                        <svg class="icon" aria-hidden="true"><use href="#i-grid" /></svg>
                        <span class="nav__label">Library</span>
                    </button>
                    <button class="nav__item" type="button" data-app-view="tiers">
                        <svg class="icon" aria-hidden="true"><use href="#i-layers" /></svg>
                        <span class="nav__label">Tier maker</span>
                    </button>
                    <button class="nav__item" type="button" data-app-view="about">
                        <svg class="icon" aria-hidden="true"><use href="#i-user" /></svg>
                        <span class="nav__label">About me</span>
                    </button>
                    <button class="nav__item" type="button" data-app-view="tops">
                        <svg class="icon" aria-hidden="true"><use href="#i-list" /></svg>
                        <span class="nav__label">My top lists</span>
                    </button>
                </nav>

                <div id="libraryNavWrap" class="nav-group">
                    <nav class="nav" id="libraryNav">
                        <p class="nav__title">Library</p>
                        <button class="nav__item is-active" type="button" data-view="all">
                            <svg class="icon" aria-hidden="true">
                                <use href="#i-grid" />
                            </svg>
                            <span class="nav__label">All games</span>
                            <span class="nav__count" data-count="all">0</span>
                        </button>
                        <button class="nav__item" type="button" data-view="favorites">
                            <img class="pixel-star nav__star" src="imgs/pixel-star.png" alt="">
                            <span class="nav__label">Favorites</span>
                            <span class="nav__count" data-count="favorites">0</span>
                        </button>
                        <button class="nav__item" type="button" data-view="backlog">
                            <i class="dot" data-status="backlog"></i>
                            <span class="nav__label">Backlog</span>
                            <span class="nav__count" data-count="backlog">0</span>
                        </button>
                        <button class="nav__item" type="button" data-view="playing">
                            <i class="dot" data-status="playing"></i>
                            <span class="nav__label">Playing</span>
                            <span class="nav__count" data-count="playing">0</span>
                        </button>
                        <button class="nav__item" type="button" data-view="completed">
                            <i class="dot" data-status="completed"></i>
                            <span class="nav__label">Completed</span>
                            <span class="nav__count" data-count="completed">0</span>
                        </button>
                        <button class="nav__item" type="button" data-view="unreviewed">
                            <i class="dot" data-status="unreviewed"></i>
                            <span class="nav__label">Not yet reviewed</span>
                            <span class="nav__count" data-count="unreviewed">0</span>
                        </button>
                    </nav>

                    <section class="nav">
                        <p class="nav__title">
                            Collections
                            <button class="icon-btn icon-btn--sm" type="button" id="newFolderBtn" title="New collection"
                                aria-label="New collection">
                                <svg class="icon" aria-hidden="true">
                                    <use href="#i-plus" />
                                </svg>
                            </button>
                        </p>
                        <div id="folderList"></div>
                        <p class="nav__hint" id="folderHint">No collections yet.</p>
                    </section>

                    <section class="nav" id="genreSection" hidden>
                        <p class="nav__title">Genres</p>
                        <div id="genreBar" class="chip-row"></div>
                    </section>
                </div>

                <div id="tierNavWrap" class="nav-group" hidden>
                    <section class="nav">
                        <p class="nav__title">
                            Tier lists
                            <button class="icon-btn icon-btn--sm" type="button" data-collection-add="tier" title="New tier list"
                                aria-label="New tier list">
                                <svg class="icon" aria-hidden="true">
                                    <use href="#i-plus" />
                                </svg>
                            </button>
                        </p>
                        <div id="tierList"></div>
                    </section>
                </div>

                <div id="aboutNavWrap" class="nav-group" hidden>
                    <section class="nav">
                        <p class="nav__title">
                            About me boards
                            <button class="icon-btn icon-btn--sm" type="button" data-collection-add="about" title="New board"
                                aria-label="New board">
                                <svg class="icon" aria-hidden="true">
                                    <use href="#i-plus" />
                                </svg>
                            </button>
                        </p>
                        <div id="aboutList"></div>
                    </section>
                </div>

                <div id="topsNavWrap" class="nav-group" hidden>
                    <section class="nav">
                        <p class="nav__title">
                            Top lists
                            <button class="icon-btn icon-btn--sm" type="button" data-collection-add="top" title="New top list"
                                aria-label="New top list">
                                <svg class="icon" aria-hidden="true">
                                    <use href="#i-plus" />
                                </svg>
                            </button>
                        </p>
                        <div id="topList"></div>
                    </section>
                </div>
            </div>

            <div class="sidebar__footer">
                <div class="save-options">
                    <div class="data-actions" id="dataActionsMenu" hidden>
                        <button class="data-action" type="button" id="exportBtn">
                            <svg class="icon" aria-hidden="true"><use href="#i-upload" /></svg>
                            <span class="data-action__text">
                                <span class="data-action__label">Export backup</span>
                                <span class="data-action__desc">Save your library as a JSON file</span>
                            </span>
                        </button>
                        <button class="data-action" type="button" id="importBtn">
                            <svg class="icon" aria-hidden="true"><use href="#i-download" /></svg>
                            <span class="data-action__text">
                                <span class="data-action__label">Import backup</span>
                                <span class="data-action__desc">Load a previously saved file</span>
                            </span>
                        </button>
                        <input type="file" id="importInput" accept="application/json" hidden>
                        <button class="data-action" type="button" id="resetTemplateBtn">
                            <svg class="icon" aria-hidden="true"><use href="#i-refresh" /></svg>
                            <span class="data-action__text">
                                <span class="data-action__label">Reset to template</span>
                                <span class="data-action__desc">Replace everything with example games</span>
                            </span>
                        </button>
                        <button class="data-action data-action--danger" type="button" id="clearDataBtn">
                            <svg class="icon" aria-hidden="true"><use href="#i-trash" /></svg>
                            <span class="data-action__text">
                                <span class="data-action__label">Clear all data</span>
                                <span class="data-action__desc">Delete everything in this browser</span>
                            </span>
                        </button>
                        <p class="sidebar__footer-hint">Backup lives on this device only — it isn't uploaded anywhere</p>
                    </div>
                    <button class="save-options__trigger" type="button" id="dataActionsBtn" aria-haspopup="true" aria-expanded="false">
                        <svg class="icon" aria-hidden="true"><use href="#i-download" /></svg>
                        <span>Save options</span>
                        <span class="save-options__chevron">
                            <svg class="icon" aria-hidden="true"><use href="#i-chevron-down" /></svg>
                        </span>
                    </button>
                </div>
            </div>
        </aside>

        <main class="main">
            <div class="view" id="libraryView">
                <div class="toolbar">
                    <div class="search">
                        <svg class="icon search__icon" aria-hidden="true">
                            <use href="#i-search" />
                        </svg>
                        <input type="search" id="gameSearch" placeholder="Search your games…" autocomplete="off">
                        <kbd class="search__kbd">/</kbd>
                    </div>

                    <label class="select">
                        <span class="select__label">Sort</span>
                        <select id="rankingSelect"></select>
                        <svg class="icon select__caret" aria-hidden="true">
                            <use href="#i-chevron-down" />
                        </svg>
                    </label>

                    <span class="toolbar__count" id="resultCount"></span>
                </div>

                <div class="main__scroll">
                    <div id="activeFilters" class="active-filters" hidden></div>
                    <div id="shows" class="shows"></div>
                    <div id="emptyState" class="empty" hidden></div>
                </div>
            </div>

            <div class="view view--split" id="tierView" hidden></div>
            <div class="view view--scroll" id="aboutView" hidden></div>
            <div class="view view--scroll" id="topsView" hidden></div>
        </main>
    </div>

    <div id="toastHost" class="toast-host" aria-live="polite"></div>
</body>

</html>
